name: CI

# Jobs:
#   test     ruff, mypy (core + ai-db-scene), pytest tests/ and packages/, eval baselines.
#   blender  headless Blender (pinned tarball, cached) + the Blender socket addon, then
#            `pytest packages/ai-db-scene/tests -m blender`.
#            The addon lives in a separate repo. Set the repository variable
#            BLENDER_ADDON_REPO (Settings > Secrets and variables > Actions > Variables) to its
#            git URL (https://...); optional variable BLENDER_ADDON_REF (branch/tag) and secret
#            BLENDER_ADDON_TOKEN (read access, for a private repo). Unset: the job is skipped.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]" -e packages/ai-db-scene
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Create CI config
        run: |
          cat > ci.json << 'EOF'
          {
            "version": 2,
            "storage": {"provider": "sqlite", "options": {"path": null, "vector_index": "exact"}},
            "retrieval": {"mode": "lexical"},
            "embedding": {"provider": "none"},
            "rerank": {"provider": "none"},
            "access": {"cross_project": {}},
            "auto_sync_paths": [],
            "trace": {"wait_patterns": null, "wait_patterns_extend": null}
          }
          EOF

      - name: Initialize database
        run: ai-db --config ci.json init --force

      - name: Run tests
        run: |
          pytest -q
          pytest -q packages

      - name: Lint
        run: ruff check .   # scope + exclusions come from [tool.ruff] in pyproject.toml

      - name: Type check
        run: |
          mypy ai_db mcp_server.py
          mypy packages/ai-db-scene/ai_db_scene

      - name: Eval lexical baseline
        env:
          AI_DB_PATH: ${{ runner.temp }}/e.db
        run: |
          ai-db --config ci.json eval --golden eval/golden/ai_db.jsonl --root . --baseline eval/baseline.json

      - name: Eval pack baseline
        env:
          AI_DB_PATH: ${{ runner.temp }}/p.db
        run: |
          ai-db --config ci.json eval --pack --golden eval/golden/ai_db_pack.jsonl --root . --baseline eval/baseline_pack.json

      - name: Eval polyglot pack baseline
        env:
          AI_DB_PATH: ${{ runner.temp }}/pg.db
        run: |
          ai-db --config ci.json eval --pack --golden eval/golden/polyglot_pack.jsonl \
            --root tests/fixtures/polyglot --all-files --baseline eval/baseline_pack_polyglot.json
      - name: Eval exact lookups (symbols, callers)
        env:
          AI_DB_PATH: ${{ runner.temp }}/refs.db
        run: |
          ai-db --config ci.json eval --symbols --golden eval/golden/symbols.jsonl \
            --root tests/fixtures/refs_py --all-files --baseline eval/baseline_symbols.json
          ai-db --config ci.json eval --callers --golden eval/golden/callers.jsonl \
            --root tests/fixtures/refs_py --all-files --baseline eval/baseline_callers.json

  blender:
    if: ${{ vars.BLENDER_ADDON_REPO != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLENDER_VERSION: "5.2.1"
      BLENDER_SERIES: "5.2"
      AI_DB_BLENDER_ADDON: ${{ github.workspace }}/../blender_addon
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]" -e packages/ai-db-scene
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Blender runtime libraries
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends libxrender1 libxi6 libxkbcommon0 \
            libsm6 libgl1 libegl1 libxxf86vm1 libxfixes3

      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          curl -fsSL "https://download.blender.org/release/Blender${BLENDER_SERIES}/blender-${BLENDER_VERSION}-linux-x64.tar.xz" \
            | tar -xJ -C ~/blender --strip-components=1

      - name: Put Blender on PATH
        run: |
          echo "$HOME/blender" >> "$GITHUB_PATH"
          "$HOME/blender/blender" --version | head -1

      - name: Check out the Blender addon
        env:
          REPO: ${{ vars.BLENDER_ADDON_REPO }}
          REF: ${{ vars.BLENDER_ADDON_REF }}
          TOKEN: ${{ secrets.BLENDER_ADDON_TOKEN }}
        run: |
          auth=()
          if [ -n "$TOKEN" ]; then
            auth=(-c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)")
          fi
          git "${auth[@]}" clone --depth 1 ${REF:+--branch "$REF"} "$REPO" "$AI_DB_BLENDER_ADDON"

      - name: Blender tests
        run: pytest -q packages/ai-db-scene/tests -m blender
