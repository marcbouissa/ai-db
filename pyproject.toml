[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-db"
version = "0.1.0"
description = "High-Performance Token-Optimized Code Intelligence & Vector Index Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ai-db Contributors" }
]
keywords = [
    "vector-database",
    "code-intelligence",
    "mcp",
    "ast",
    "bm25",
    "fts5",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = []

[project.optional-dependencies]
mysql = [
    "pymysql>=1.1.0",
    "cryptography>=42.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
all = [
    "ai-db[mysql,dev]",
]

[project.scripts]
ai-db = "ai_db.cli:main"
vectordb = "ai_db.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_db*"]
exclude = ["tests*", ".agents*"]

[tool.setuptools]
py-modules = ["vectordb", "mcp_server"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short"
markers = [
    "packaging: packaging and environment tests",
    "sanitization: repository sanitization tests",
    "storage: storage layer tests",
    "transports: communication and transport tests",
    "telemetry: telemetry tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
