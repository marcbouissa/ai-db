[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-db"
version = "0.1.0"
description = "High-Performance Token-Optimized Code Intelligence & Vector Index Platform"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "ai-db Contributors" }
]
keywords = [
    "vector-database",
    "code-intelligence",
    "mcp",
    "ast",
    "bm25",
    "fts5",
    "ai-agents",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
]
dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "sqlite-vec>=0.1.6",
    "tiktoken>=0.8",
    "watchfiles>=1.0",
    "numpy>=2.0",
]

[project.optional-dependencies]
local-embed = [
    "sentence-transformers>=3.3",
    "torch>=2.4",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
all = [
    "ai-db[local-embed,dev]",
]

[project.scripts]
ai-db = "ai_db.cli:main"
vectordb = "ai_db.cli:main"

[project.entry-points."ai_db.storage"]
sqlite = "ai_db.storage.sqlite_backend:SQLiteBackend.from_options"

[tool.setuptools.packages.find]
where = ["."]
include = ["ai_db*"]
exclude = ["tests*", ".agents*"]

[tool.setuptools]
py-modules = ["vectordb", "mcp_server"]

[tool.setuptools.package-data]
ai_db = ["parser/queries/*.scm"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-v --tb=short -m \"not bench and not model\""
markers = [
    "packaging: packaging and environment tests",
    "sanitization: repository sanitization tests",
    "storage: storage layer tests",
    "transports: communication and transport tests",
    "telemetry: telemetry tests",
    "bench: performance benchmarks (run with -m bench)",
    "slow: long-running tests (full-size corpora, large downloads)",
    "model: tests that download and run real ML models (run with -m model)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
# Pin ruff to the project's own code. Without an `include`, the `ruff check .`
# that CI runs also picks up any stray .py dropped at the repo root -- and
# `ruff check --fix` will happily *rewrite* it, which is how 19 leftover
# debugging scripts ended up silently modified. An explicit allowlist means a
# whole-tree lint run can never mutate a file nobody is looking at.
# `include` filters discovery only: naming a file explicitly on the command
# line still processes it, which is the correct behaviour for a user who
# points ruff at their own file.
include = [
    "ai_db/**/*.py",
    "tests/**/*.py",
    "eval/**/*.py",
    "mcp_server.py",
    "vectordb.py",
]
# token_benchmark.py is a local scratch benchmark and is gitignored; keeping it
# out here means the exclusion does not depend on every caller remembering a
# --exclude flag.
exclude = ["token_benchmark.py"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["sqlite_vec", "sentence_transformers", "tree_sitter_language_pack", "tiktoken"]
ignore_missing_imports = true
